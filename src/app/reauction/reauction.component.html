<div class="navigation">
    <button (click)="backToSellerPage()">Return to main seller page</button>
    <button (click)="createNewAuction()">Add new item</button>
</div>
<div class="items-container">
    <h1>Here is the list of your past auctions</h1>

    <div *ngIf="items.length > 0; else noItems">
        <div *ngFor="let item of items" class="items-card">
            <h3>{{ item.name }}</h3>
            <p>{{ item.description }}</p>

            <button class="toggle-form" (click)="toggleForm(item)">
                <span [ngClass]="{ 'arrow-down': !showForm, 'arrow-up': showForm }"></span>
                Enter details of new auction
            </button>

            <div *ngIf="showForm" class="auction-form">
                <form #auctionForm="ngForm">
                    <div class="grid-form">
                        
                        <div>
                            <label for="firstbid">Starting bid</label>
                            <input type="number" id="firstbid" name="firstbid" [(ngModel)]="item.auction.firstBid" required />
                        </div>
                        
                        <div>
                            <label for="buyprice">Buy Price</label>
                            <input type="number" id="buyprice" name="buyprice" [(ngModel)]="item.auction.buyPrice" />
                        </div>
                        
                        <div>
                            <label for="startTime">Start Time</label>
                            <input type="datetime-local" id="starttime" name="starttime" [(ngModel)]="item.auction.startTime" required />
                        </div>

                        <div>
                            <label for="endTime">End Time</label>
                            <input type="datetime-local" id="endtime" name="endtime" [(ngModel)]="item.auction.endTime" required />
                        </div>

                        <div>
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" [(ngModel)]="item.auction.address" required />
                        </div>

                        <div>
                            <label for="location">Location</label>
                            <input type="text" id="location" name="location" [(ngModel)]="item.auction.location" required />
                        </div>

                        <div>
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" [(ngModel)]="item.auction.city" required />
                        </div>

                        <div>
                            <label for="country">Country</label>
                            <input type="text" id="country" name="country" [(ngModel)]="item.auction.country" required />
                        </div>

                    </div>

                    <button type="button" (click)="createAuction(item)" [disabled]="!auctionForm.valid || item.auction.active">Create</button>
                </form>
            </div>
        </div>

        <div class="pagination">
            <button (click)="prevPage()" [disabled]="page === 0">Previous</button>
            <span>Page {{ page + 1 }} of {{ totalPages }}</span>
            <button (click)="nextPage()" [disabled]="page >= totalPages - 1">Next</button>
        </div>
    </div>

    <ng-template #noItems>
        <p>You haven't put any items up for auction yet</p>
    </ng-template>
</div>

<div class="navigation">
    <button (click)="backToSellerPage()">Return to main seller page</button>
</div>

<div class="edit-auction-container">
    <h1>Edit the following details of your auction</h1>

    <form class="edit-auction-form">
        <div class="form-column">
            <label for="buy-price">Buy Price:</label>
            <input type="number" id="buy-price" name="buy-price" [(ngModel)]="auction.buyPrice" />
    
            <label for="description">Description:</label>
            <textarea id="description" name="description" [(ngModel)]="auction.item.description"></textarea>
    
            <label for="starttime">Start Time:</label>
            <input type="datetime-local" id="starttime" name="starttime" [(ngModel)]="auction.startTime" />
    
            <label for="endtime">End Time:</label>
            <input type="datetime-local" id="endtime" name="endtime" [(ngModel)]="auction.endTime" />
        </div>
    
        <div class="form-column">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" [(ngModel)]="auction.address" />
    
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" [(ngModel)]="auction.location" />
    
            <label for="city">City:</label>
            <input type="text" id="city" name="city" [(ngModel)]="auction.city" />
    
            <label for="country">Country:</label>
            <input type="text" id="country" name="country" [(ngModel)]="auction.country" />
        </div>
    </form>

    <div class="form-buttons">
        <button type="button" (click)="saveChanges()">Save Changes</button>
        <button type="button" (click)="deleteAuction()">Delete Auction</button>
        <button type="button" (click)="cancelEdit()">Cancel</button>
    </div>
</div>

<div class="navigation">
    <button (click)="roleSelector()">Change type of visitor</button>
</div>
<div class="auctions-container">
    <div *ngIf="user">
        <h1>Welcome back {{ user?.firstname }}!</h1>
        <h2>Here are the currently active auctions</h2>
    </div>

    <!-- Serach bar and filters -->
    <div class="search-filter-container">
        <!-- Row 1: Search bar -->
        <div class="search-row">
            <input
            type="text"
            [(ngModel)]="keyword"
            placeholder="Search auctions by name, category or description..." />
            <button (click)="search()">Search</button>
        </div>

        <!-- Row 2: Select filters based on category, location, city and country -->
        <div class="filters-row">
            <select [(ngModel)]="selectedCategory" (change)="onCategoryChange()">
            <option value="">All Categories</option>
            <option *ngFor="let category of categories" [value]="category.name">{{ category.name }}</option>
            </select>

            <select [(ngModel)]="selectedLocation" (change)="onLocationChange()">
            <option value="">All Locations</option>
            <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
            </select>

            <select [(ngModel)]="selectedCity" (change)="onCityChange()">
            <option value="">All Cities</option>
            <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
            </select>

            <select [(ngModel)]="selectedCountry" (change)="onCountryChange()">
            <option value="">All Countries</option>
            <option *ngFor="let c of countries" [value]="c">{{ c }}</option>
            </select>
        </div>

        <!-- Row 3: Clear filters -->
        <div class="clear-row">
            <button class="clear-filters" (click)="clearFilters()">Clear Filters</button>
        </div>

        <label class="checkbox-row">
            <input type="checkbox" [(ngModel)]="activeOnly" (change)="loadAuctionsOrdered()" />
            <span class="checkmark"></span>
            Show only active auctions
        </label>

    </div>

    <!-- Container with the available, paginated auctions based on the filters selected -->
    <div *ngFor="let auction of auctions" class="auction-card">
        <h3>{{ auction.item.name }} {{ auction.active ? '(active)' : '(inactive)' }}</h3>
        <p>{{ auction.item.description }}</p>

        <div class="auction-actions">
            <button (click)="viewAuctionDetails(auction.auctionid)">Details</button>
            <!-- Chat with the seller of the auction is only available if the current in user is the winner -->
            <button
                *ngIf="user && auction.winner?.userid === user.userid"
                (click)="goToChat(auction.auctionid)">
                Chat with seller ({{ auction.unreadMessages }} unread messages)
            </button>
        </div>
    </div>

    <div class="pagination">
        <button (click)="prevPage()" [disabled]="page < 1">Previous</button>
        <span>Page {{ page + 1 }} of {{ totalPages }}</span>
        <button (click)="nextPage()" [disabled]="page >= totalPages - 1">Next</button>
    </div>
</div>
